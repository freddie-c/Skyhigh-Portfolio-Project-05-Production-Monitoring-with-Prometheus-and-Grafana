services:
  prometheus:
    # Pinned version, never :latest — reproducible builds
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Config file, read-only inside the container
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules directory, read-only
      - ./prometheus/rules:/etc/prometheus/rules:ro
      # Named volume for the time-series database
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Explicit retention — without this the disk fills silently
      - '--storage.tsdb.retention.time=15d'

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      # Read from .env — never hardcoded, never committed
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      # Block anonymous access
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Disable the "create account" flow
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data: