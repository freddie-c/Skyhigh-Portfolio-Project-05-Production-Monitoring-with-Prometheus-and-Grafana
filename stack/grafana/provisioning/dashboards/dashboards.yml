apiVersion: 1

providers:
  # Name of this provisioning provider
  - name: skyhigh
    orgId: 1
    # Grafana folder the dashboards land in
    folder: SkyHigh
    type: file
    # Blocks deleting a provisioned dashboard from the UI
    disableDeletion: true
    # How often Grafana rescans the path for changes
    updateIntervalSeconds: 30
    options:
      # Path INSIDE the container, not on the host
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false